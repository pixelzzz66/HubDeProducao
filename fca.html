<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCA — Hub de Produção</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <main id="app-main">
    <h1>FCA</h1>
    <p>Árvore de disciplinas e pré-requisitos dos cursos de Engenharia de Produção e Manufatura (catálogo 2026).</p>

    <div class="fca-controles">
      <label class="campo">
        Curso
        <select id="fca-curso"></select>
      </label>
      <label class="campo">
        Buscar disciplina
        <input type="text" id="fca-busca" placeholder="Código ou nome (ex: LE101, Cálculo)" autocomplete="off" />
      </label>
    </div>

    <div id="fca-lista" class="fca-lista"></div>
  </main>
  <footer id="app-footer"></footer>
  <script type="module" src="assets/js/app.js"></script>
  <script type="module" src="assets/js/fca.js"></script>
</body>
</html>
