<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121823" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#2a8bb0" />
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)" stroke="#1f2a3a" stroke-width="2"/>

  <!-- Anel externo estilo HUD -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#1f2a3a" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-dasharray="10 15" stroke-dashoffset="5" opacity="0.6"/>

  <!-- Hexágono de Produção -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Linhas de conexão internas -->
  <line x1="50" y1="18" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
  <line x1="78" y1="34" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
  <line x1="78" y1="66" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
  <line x1="50" y1="82" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
  <line x1="22" y1="66" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>
  <line x1="22" y1="34" x2="50" y2="50" stroke="#4cc9f0" stroke-width="2" opacity="0.3"/>

  <!-- Nós do Hub -->
  <circle cx="50" cy="18" r="5" fill="#4cc9f0" />
  <circle cx="78" cy="34" r="5" fill="#4cc9f0" />
  <circle cx="78" cy="66" r="5" fill="#4cc9f0" />
  <circle cx="50" cy="82" r="5" fill="#4cc9f0" />
  <circle cx="22" cy="66" r="5" fill="#4cc9f0" />
  <circle cx="22" cy="34" r="5" fill="#4cc9f0" />

  <!-- Letra H central -->
  <path d="M 38 42 L 38 58 M 62 42 L 62 58 M 38 50 L 62 50" fill="none" stroke="#e6edf5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="2" fill="#4cc9f0" />
</svg>
